version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Europe/Prague"
    target-branch: "dev"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "vitest-*"
          - "@vitest/*"
